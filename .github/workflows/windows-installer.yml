name: Windows installer

# Builds Beolkkuri-Setup.exe (scripts/windows/build_installer.ps1) and, given a tag,
# attaches it to that release. Manual only: releases get the installer built on the
# owner's PC, so publishing a release must not start this.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (empty: build main, no upload)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build and test the installer
        shell: powershell
        run: ./scripts/windows/build_installer.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: Beolkkuri-Setup
          path: dist/Beolkkuri-Setup.exe
      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Beolkkuri-Setup.exe --clobber
