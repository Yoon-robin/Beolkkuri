name: Windows installer

# Builds Beolkkuri-Setup.exe (scripts/windows/build_installer.ps1) and attaches it to
# the release, so releases/latest/download/Beolkkuri-Setup.exe always points at it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (empty: build main, no upload)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - name: Build and test the installer
        shell: powershell
        run: ./scripts/windows/build_installer.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: Beolkkuri-Setup
          path: dist/Beolkkuri-Setup.exe
      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Beolkkuri-Setup.exe --clobber
